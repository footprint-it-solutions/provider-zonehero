---
apiVersion: listener.zonehero.footprintit.net/v1alpha1
kind: Listener
metadata:
  name: footprint-hlb-test-listener
spec:
  forProvider:
    loadBalancerRef:
      name: footprint-hlb-test
    port: 80
    protocol: "HTTP"
    targetGroupArn: "arn:aws:elasticloadbalancing:eu-west-1:203918840229:targetgroup/hlb-test-tg/835f57bf8351d3e0" # target group linked to the hlb-test-alb
    overprovisioningFactor: 1.1
  providerConfigRef:
    name: zonehero-provider-test-partition
---
apiVersion: listener.zonehero.footprintit.net/v1alpha1
kind: Listener
metadata:
  name: footprint-hlb-test-listener-v2
spec:
  forProvider:
    loadBalancerRef:
      name: footprint-hlb-test
    port: 81
    protocol: "HTTP"
    targetGroupArn: "arn:aws:elasticloadbalancing:eu-west-1:203918840229:targetgroup/hlb-test-tg/835f57bf8351d3e0" # target group linked to the hlb-test-alb
    overprovisioningFactor: 1.1
  providerConfigRef:
    name: zonehero-provider-test-partition
---
apiVersion: hostedloadbalancer.zonehero.footprintit.net/v1alpha1
kind: HostedLoadBalancer
metadata:
  name: footprint-hlb-test
  annotations:
    meta.upbound.io/example-id: hlb/v1alpha1/hostedloadbalancer
  labels:
    testing.upbound.io/example-name: example
spec:
  forProvider:
    name: footprint-hlb-test
    enableHttp2: true
    internal: false
    ec2IamRole: lb-ssm
    ipAddressType: ipv4
    subnets:
    - subnet-07742d814a98f58da
    securityGroups:
    - sg-0a03d2b266747b67f
    zoneId: Z0100484379B8YR2UX43J
    zoneName: k3s-devel.footprintit.net
  providerConfigRef:
    name: zonehero-provider-test-partition
---
